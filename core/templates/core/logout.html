{% extends 'base.html' %}
{% load static %}

{% block title %}Logged Out — CrowdFarm{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 56px); background: #f8f9fa;">
    <div class="card border-0 shadow-sm p-4 p-sm-5 text-center" style="max-width: 450px; width: 100%; border-radius: 1rem;">
        <div class="mb-4">
            <div class="rounded-circle bg-success bg-opacity-10 d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px; margin: 0 auto;">
                <i class="ph-check-circle text-success" style="font-size: 2.5rem;"></i>
            </div>
        </div>
        <h3 class="fw-bold mb-2">You're safely logged out</h3>
        <p class="text-muted mb-4">Thank you for using CrowdFarm. See you next time!</p>
        
        <a href="{% url 'login' %}" class="btn btn-success btn-lg w-100 fw-semibold mb-3">
            <i class="ph-sign-in me-2"></i> Log back in
        </a>
        <a href="{% url 'home' %}" class="btn btn-outline-secondary w-100">
            Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
